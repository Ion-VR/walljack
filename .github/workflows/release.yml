name: Release

# Tag a version to publish binaries:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Because gopacket/pcap uses cgo, the binaries cannot be cross-compiled from one
# runner. Each OS builds its own, then both are attached to the GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Build
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o walljack-linux-amd64 ./cmd/walljack

      - uses: actions/upload-artifact@v4
        with:
          name: walljack-linux-amd64
          path: walljack-linux-amd64

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      # Building against Npcap needs its SDK headers and wpcap.lib. The runtime
      # (Npcap itself) is installed by the end user, not here.
      - name: Fetch Npcap SDK
        shell: pwsh
        run: |
          $url = "https://npcap.com/dist/npcap-sdk-1.13.zip"
          Invoke-WebRequest -Uri $url -OutFile npcap-sdk.zip
          Expand-Archive -Path npcap-sdk.zip -DestinationPath $env:GITHUB_WORKSPACE\npcap-sdk

      - name: Build
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: |
          $sdk = "$env:GITHUB_WORKSPACE\npcap-sdk"
          $env:CGO_CFLAGS = "-I$sdk\Include"
          $env:CGO_LDFLAGS = "-L$sdk\Lib\x64"
          go build -trimpath `
            -ldflags "-s -w -X main.version=$env:GITHUB_REF_NAME" `
            -o walljack-windows-amd64.exe ./cmd/walljack

      - uses: actions/upload-artifact@v4
        with:
          name: walljack-windows-amd64
          path: walljack-windows-amd64.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          body: |
            Download the binary for your platform below.

            Windows also needs the [Npcap](https://npcap.com/) runtime installed,
            with "WinPcap API-compatible mode" ticked. Linux needs libpcap
            (`sudo apt install libpcap0.8`), which most distributions already have.

            Capture needs elevated privileges: run an Administrator terminal on
            Windows, or `sudo` on Linux.
